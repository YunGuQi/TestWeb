# 挂到宝塔：/www/server/panel/vhost/nginx/extension/test-platform/copy.conf
# 作用：test.mutong-xhs.top/copy → 纯静态复制板，公开访问无口令，不进 Next.js，不影响 /emo 等测试路由

location ^~ /copy/ {
    alias /www/wwwroot/copy-board/;
    index index.html;
    try_files $uri $uri/ =404;
}

# 兼容无尾斜杠
location = /copy {
    return 301 /copy/;
}
