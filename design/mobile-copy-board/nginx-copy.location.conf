# 挂到宝塔：/www/server/panel/vhost/nginx/extension/test-platform/copy.conf
# 作用：test.mutong-xhs.top/copy → 静态复制板，不进 Next.js，不影响 /emo 等测试路由

location ^~ /copy/ {
    alias /www/wwwroot/copy-board/;
    index index.html;
    try_files $uri $uri/ =404;

    # 禁止直接下载口令本地配置
    location ~* /copy/auth/config\.local\.php$ {
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }
}

# 兼容无尾斜杠
location = /copy {
    return 301 /copy/;
}
