<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隐藏的欲望测试</title>
  
  <!-- 必须引入 Tailwind CSS 以支持 test-matrix.js 矩阵弹窗 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 html-to-image 替代 html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    :root {
      --bg-color: #0d0d0f;
      --text-main: #f0f0f5;
      --text-sub: #888896;
      --accent-color: #e53935;
      --accent-hover: #b71c1c;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* 通用容器 */
    .app-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: none;
      flex-direction: column;
      position: relative;
    }
    .app-container.active {
      display: flex;
    }

    /* 封面页 */
    .cover-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      margin-top: 15vh;
    }
    .cover-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff, #ff5252);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .cover-subtitle {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 60px;
      line-height: 1.6;
    }
    .btn-main {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(229, 57, 53, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-main:active {
      transform: scale(0.95);
      background-color: var(--accent-hover);
    }
    
    /* 底部双按钮 Flex 布局（防堆叠规范） */
    .bottom-actions-flex {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      width: 100%;
    }
    .btn-secondary {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .btn-secondary:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* 问答页 */
    .quiz-header {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--card-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }
    .quiz-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-sub);
      font-size: 14px;
    }
    .btn-back {
      color: var(--text-sub);
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    
    /* 深度报告滑动卡片 */
    .deep-dive-report-swipe {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 20px 20px;
      gap: 16px;
      scrollbar-width: none;
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .deep-dive-report-swipe::-webkit-scrollbar {
      display: none;
    }
    .report-card-item {
      flex: 0 0 calc(100% - 60px);
      scroll-snap-align: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .report-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-color);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .report-card-body {
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
    }
    .swipe-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      opacity: 0.6;
      margin-top: 15px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    
    .question-box {
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease;
    }
    .options-box {
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px; /* 4个选项稍微减小间距 */
    }
    .option-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      color: var(--text-main);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      animation: slideUp 0.4s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    .option-btn:nth-child(1) { animation-delay: 0.1s; }
    .option-btn:nth-child(2) { animation-delay: 0.2s; }
    .option-btn:nth-child(3) { animation-delay: 0.3s; }
    .option-btn:nth-child(4) { animation-delay: 0.4s; }
    .option-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
      transform: scale(0.98);
    }

    /* 结果页 - 海报区 */
    .result-container {
      padding: 20px;
    }
    /* #capture-wrapper 作为滑动容器 */
    #capture-wrapper {
      padding: 10px 20px 30px 20px;
      background-color: var(--bg-color);
      position: relative;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 16px;
      scrollbar-width: none;
    }
    #capture-wrapper::-webkit-scrollbar {
      display: none;
    }
    .poster-card {
      flex: 0 0 calc(100% - 20px);
      scroll-snap-align: center;
      background: linear-gradient(180deg, #1a1a24 0%, #111116 100%);
      border: 1px solid rgba(229, 57, 53, 0.3);
      border-radius: 20px;
      padding: 30px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(229, 57, 53, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    /* 滑动画廊导航栏 */
    .carousel-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
      padding: 0 10px;
      user-select: none;
    }
    .nav-btn {
      color: var(--text-sub);
      background: none;
      border: none;
      font-size: 28px;
      font-weight: 300;
      padding: 0 15px;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
    }
    .nav-btn:active {
      transform: scale(0.9);
      color: #fff;
    }
    .nav-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-hint {
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.6;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .nav-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-main);
      letter-spacing: 2px;
    }
    
    .poster-header {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
    }
    .poster-title-label {
      font-size: 14px;
      color: var(--accent-color);
      font-weight: bold;
      letter-spacing: 1px;
    }
    .poster-title {
      font-size: 36px;
      font-weight: 900;
      margin: 10px 0 20px;
      color: #fff;
    }
    .poster-desc {
      font-size: 15px;
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .tag-item {
      background: rgba(229, 57, 53, 0.1);
      border: 1px solid rgba(229, 57, 53, 0.3);
      color: #ff5252;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }
    /* 危险印章绝对定位，注意：不能同时设 top 和 bottom */
    .stamp {
      position: absolute;
      top: 20px;
      right: -20px;
      width: 100px;
      height: 100px;
      border: 3px solid rgba(229, 57, 53, 0.4);
      color: rgba(229, 57, 53, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      transform: rotate(25deg);
      pointer-events: none;
    }
    .poster-footer {
      border-top: 1px dashed var(--border-color);
      padding-top: 16px;
      font-size: 10px;
      color: var(--text-sub);
      text-align: center;
    }
    .disclaimer {
      font-size: 9px;
      opacity: 0.5;
      margin-top: 8px;
    }
    
    /* 结果页 - 操作区 */
    .result-actions {
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 历史记录抽屉 */
    .history-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .history-modal.active { display: flex; }
    .history-content {
      background: linear-gradient(180deg, #1a1a24 0%, #111116 100%);
      border: 1px solid rgba(229, 57, 53, 0.3);
      width: 100%;
      max-width: 400px;
      max-height: 75vh;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    .history-close {
      text-align: center;
      padding: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      margin-top: 20px;
      cursor: pointer;
    }
    #history-list {
      overflow-y: auto;
      flex-grow: 1;
    }
    .history-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item span {
      color: #fff;
    }

    /* 长按保存遮罩 */
    .capture-mask {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .capture-mask.active { display: flex; }
    .capture-img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    .capture-tip {
      color: white;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  </style>
</head>
<body>

  <!-- 隐藏的引流矩阵容器 -->
  <div id="dummy-matrix-container" style="display: none;"></div>

  <!-- 封面页 -->
  <div id="page-start" class="app-container active">
    <div class="cover-content">
      <div class="cover-title">潜意识档案室</div>
      <div class="cover-subtitle">18次直觉拷问<br>测出你最原始的本能欲望</div>
      <button class="btn-main" onclick="startQuiz()">开始解剖</button>
    </div>
    
    <!-- 防堆叠规范：使用 flex 并排 -->
    <div class="bottom-actions-flex">
      <button class="btn-secondary" id="btn-history" onclick="showHistory()" style="display:none;">我的档案</button>
      <button class="btn-secondary" onclick="window.openMatrixModal && window.openMatrixModal()">探索更多欲望</button>
    </div>
  </div>

  <!-- 问答页 -->
  <div id="page-quiz" class="app-container">
    <div class="quiz-header">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="quiz-top-bar">
        <button class="btn-back" onclick="prevQuestion()">← 上一题</button>
        <span id="progress-text">1 / 18</span>
      </div>
    </div>
    <div class="question-box" id="question-text">问题加载中...</div>
    <div class="options-box" id="options-container">
      <!-- 选项按钮动态生成 -->
    </div>
  </div>

  <!-- 结果页 -->
  <div id="page-result" class="app-container">
    <div class="carousel-nav">
      <button onclick="switchPoster(-1)" class="nav-btn">&lsaquo;</button>
      <div class="nav-indicator">
        <span class="nav-hint">滑动或点击查阅报告档案</span>
        <span id="poster-indicator" class="nav-title">核心潜意识档案</span>
      </div>
      <button onclick="switchPoster(1)" class="nav-btn">&rsaquo;</button>
    </div>
    <div id="capture-wrapper">
      <!-- ================= 海报卡片 1：核心报告 ================= -->
      <div class="poster-card" id="poster-card-0">
        <div class="stamp">DANGER</div>
        <div class="poster-header">
          <span>实验对象: <span id="poster-id"></span></span>
          <span>纯度: <span id="poster-purity"></span></span>
        </div>
        <div class="poster-title-label">检测到你潜意识中最高的本能是</div>
        <div class="poster-title" id="res-title">加载中</div>
        <div class="tags-container" id="res-tags">
          <!-- Tags -->
        </div>
        <div class="poster-desc" id="res-desc">
          解析加载中...
        </div>
        
        <div style="margin-top: auto; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 20px;">
          <div style="font-size:12px; color:var(--text-sub); margin-bottom:15px; text-align:center; letter-spacing:1px;">潜意识欲望分布图谱</div>
          <div id="res-bars" style="display:flex; flex-direction:column; gap:12px;">
            <!-- 进度条由 JS 动态渲染 -->
          </div>
        </div>

        <div class="poster-footer" style="margin-top: 25px;">
          <div>扫码透视你的“潜意识欲望”</div>
          <div class="disclaimer">仅供娱乐体验，非专业心理诊断</div>
        </div>
      </div>
      
      <!-- ================= 海报卡片 2：深度解析 ================= -->
      <div class="poster-card" id="poster-card-1" style="padding-bottom: 30px; overflow-y: auto; display: block;">
        <div class="stamp" style="font-size: 40px; top: 50px; right: 10px; opacity: 0.03; transform: rotate(-15deg);">REPORT</div>
        
        <div class="poster-header" style="margin-bottom: 25px;">
          <span>附属档案: 深度解析</span>
          <span>密级: S级</span>
        </div>
        
        <div style="margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <div style="width: 3px; height: 14px; background-color: var(--accent-color); border-radius: 2px; box-shadow: 0 0 8px rgba(229, 57, 53, 0.6);"></div>
            <div class="poster-title-label" style="font-size: 14px; color: #fff; letter-spacing: 1px;">核心欲望解析</div>
          </div>
          <div class="poster-desc" id="dd-diagnosis" style="color: var(--text-sub); font-size: 13px; margin-bottom: 0; line-height: 1.7; text-align: justify;"></div>
        </div>

        <div style="width: 100%; height: 1px; border-top: 1px dashed rgba(255,255,255,0.1); margin: 16px 0;"></div>

        <div style="margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <div style="width: 3px; height: 14px; background-color: var(--accent-color); border-radius: 2px; box-shadow: 0 0 8px rgba(229, 57, 53, 0.6);"></div>
            <div class="poster-title-label" style="font-size: 14px; color: #fff; letter-spacing: 1px;">欲望投射效应</div>
          </div>
          <div class="poster-desc" id="dd-interpretation" style="color: var(--text-sub); font-size: 13px; margin-bottom: 0; line-height: 1.7; text-align: justify;"></div>
        </div>

        <div style="width: 100%; height: 1px; border-top: 1px dashed rgba(255,255,255,0.1); margin: 16px 0;"></div>

        <div style="margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <div style="width: 3px; height: 14px; background-color: var(--accent-color); border-radius: 2px; box-shadow: 0 0 8px rgba(229, 57, 53, 0.6);"></div>
            <div class="poster-title-label" style="font-size: 14px; color: #fff; letter-spacing: 1px;">潜意识假面画像</div>
          </div>
          <div class="poster-desc" id="dd-audience" style="color: var(--text-sub); font-size: 13px; margin-bottom: 0; line-height: 1.7; text-align: justify;"></div>
        </div>

        <div style="width: 100%; height: 1px; border-top: 1px dashed rgba(255,255,255,0.1); margin: 16px 0;"></div>

        <div style="margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <div style="width: 3px; height: 14px; background-color: var(--accent-color); border-radius: 2px; opacity: 0.6;"></div>
            <div class="poster-title-label" style="font-size: 14px; color: var(--accent-color); letter-spacing: 1px;">失控危险阈值</div>
          </div>
          <div class="poster-desc" id="dd-risk" style="color: var(--text-sub); font-size: 13px; margin-bottom: 0; line-height: 1.7; text-align: justify;"></div>
        </div>

        <div style="width: 100%; height: 1px; border-top: 1px dashed rgba(255,255,255,0.1); margin: 16px 0;"></div>

        <div>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <div style="width: 3px; height: 14px; background-color: var(--accent-color); border-radius: 2px; box-shadow: 0 0 8px rgba(229, 57, 53, 0.6);"></div>
            <div class="poster-title-label" style="font-size: 14px; color: var(--accent-color); letter-spacing: 1px;">欲望纾解指南</div>
          </div>
          <div class="poster-desc" id="dd-advice" style="color: var(--text-main); font-size: 13px; margin-bottom: 0; line-height: 1.7; text-align: justify; font-weight: 500;"></div>
        </div>
      </div>
    </div>
    
    <div class="result-actions">
      <button class="btn-main" style="width: 100%;" onclick="generatePoster()">保存我的专属档案</button>
    </div>
    
    <div class="bottom-actions-flex" style="padding-top:0; margin-top: 10px;">
      <button class="btn-secondary" onclick="resetQuiz()">重新建档</button>
      <button class="btn-secondary" onclick="window.openMatrixModal && window.openMatrixModal()">探索更多欲望</button>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div id="history-modal" class="history-modal">
    <div class="history-content">
      <h3 style="font-size:18px; font-weight:800; color:var(--accent-color); margin-bottom:20px; text-align:center;">潜意识档案记录</h3>
      <div id="history-list"></div>
      <div class="history-close" onclick="closeHistory()">收起档案</div>
    </div>
  </div>

  <!-- 截图生成弹窗 -->
  <div id="capture-modal" class="capture-mask">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center;">
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:15px; padding:0 20px;">
        <button onclick="switchModalPoster(-1)" style="background:none; border:none; font-size:24px; color:var(--accent-color); font-weight:bold; cursor:pointer;">&lt;</button>
        <div class="capture-tip" style="margin:0;">✨ 长按图片保存 ✨</div>
        <button onclick="switchModalPoster(1)" style="background:none; border:none; font-size:24px; color:var(--accent-color); font-weight:bold; cursor:pointer;">&gt;</button>

      window.addEventListener("popstate", (e) => {
        if(document.getElementById("page-result").classList.contains("active")) {
          // 如果用户在结果页点后退，为了防止丢失结果，强制留在结果页
          window.history.pushState(null, null, '#result');
        }
      });
    });

    function showPage(pageId) {
      document.querySelectorAll('.app-container').forEach(el => el.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function checkHistory() {
      const history = JSON.parse(localStorage.getItem('hiddenDesiresHistory') || '[]');
      if (history.length > 0) {
        document.getElementById('btn-history').style.display = 'block';
      }
    }

    function startQuiz() {
      currentQ = 0;
      scores = [];
      
      // 题目与选项随机乱序
      quizData.sort(() => Math.random() - 0.5);
      quizData.forEach(q => q.options.sort(() => Math.random() - 0.5));
      
      showPage('page-quiz');
      renderQuestion();
      window.history.pushState(null, null, '#quiz');
    }

    function renderQuestion() {
      const qData = quizData[currentQ];
      document.getElementById("question-text").innerText = qData.q;
      
      // 更新进度
      document.getElementById("progress-text").innerText = `${currentQ + 1} / ${quizData.length}`;
      document.getElementById("progress-bar").style.width = `${((currentQ + 1) / quizData.length) * 100}%`;
      
      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      
      qData.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.t;
        btn.onclick = () => selectOption(opt.v);
        optContainer.appendChild(btn);
      });
    }

    function selectOption(val) {
      scores.push(val);
      if (currentQ < quizData.length - 1) {
        currentQ++;
        setTimeout(renderQuestion, 150);
      } else {
        calculateResult();
      }
    }

    function prevQuestion() {
      if (currentQ > 0) {
        currentQ--;
        scores.pop();
        renderQuestion();
      } else {
        showPage('page-start');
        window.history.pushState(null, null, '');
      }
    }

    function calculateResult() {
      const counts = {A:0, B:0, C:0, D:0, E:0, F:0};
      scores.forEach(v => counts[v]++);
      
      let maxDim = 'A';
      let maxScore = -1;
      
      for (const dim of ['A', 'B', 'C', 'D', 'E', 'F']) {
        if (counts[dim] > maxScore) {
          maxScore = counts[dim];
          maxDim = dim;
        }
      }
      
      // 动态计算纯度：除以该维度的最大可能得分
      const maxCounts = {A:0, B:0, C:0, D:0, E:0, F:0};
      quizData.forEach(q => q.options.forEach(opt => maxCounts[opt.v]++));
      let basePurity = (maxScore / maxCounts[maxDim]) * 100;
      
      // 算法放大：为主导欲望增加75%的保底，让结果看起来更极端、更有冲击力
      basePurity = 75 + (basePurity * 0.24);
      
      let finalPurity = basePurity >= 99 ? "99.9" : (basePurity + Math.random() * 1).toFixed(1);
      if (parseFloat(finalPurity) > 99.9) finalPurity = "99.9";
      finalPurity += "%";
      
      const resId = Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*1000);
      renderResultPage(maxDim, resId, false, finalPurity, counts);
    }

    function renderResultPage(resKey, resId, isHistory = false, purityStr = "99.9%", counts = null) {
      const data = resultsPool[resKey];
      
      document.getElementById("poster-id").innerText = resId;
      document.getElementById("poster-purity").innerText = purityStr;
      document.getElementById("res-title").innerText = data.title;
      document.getElementById("res-desc").innerText = data.desc;
      
      const tagsHtml = data.tags.map(t => `<div class="tag-item"># ${t}</div>`).join('');
      document.getElementById("res-tags").innerHTML = tagsHtml;
      
      if (counts) {
        // 计算每个维度的最大可能得分
        const maxCounts = {A:0, B:0, C:0, D:0, E:0, F:0};
        quizData.forEach(q => {
          q.options.forEach(opt => maxCounts[opt.v]++);
        });
        
        const sortedDims = ['A', 'B', 'C', 'D', 'E', 'F'].sort((a, b) => counts[b] - counts[a]);
        const dimNames = { A: "占有欲", B: "情欲", C: "禁欲", D: "破坏欲", E: "窥探欲", F: "逃避欲" };
        
        let barsHtml = '';
        sortedDims.forEach(dim => {
          // 这里将得分除以该维度的最大可能得分，计算出“各自的百分比”
          let percentage = ((counts[dim] / maxCounts[dim]) * 100);
          
          // 增加一点小随机数让数据显得更真实，并确保封顶在 99.9%
          let finalPercent = percentage >= 99 ? "99.9" : (percentage + (Math.random() * 2)).toFixed(1);
          if (parseFloat(finalPercent) > 99.9) finalPercent = "99.9";
          
          // 如果是主导维度，强制与右上角的纯度保持完全一致，避免随机小数导致的差异
          if (dim === resKey && purityStr) {
            finalPercent = purityStr.replace('%', '');
          }
          
          barsHtml += `
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
              <div style="width: 50px; color: var(--text-main); text-align: right; margin-right: 10px;">${dimNames[dim]}</div>
              <div style="flex-grow: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
                <div style="height: 100%; width: ${finalPercent}%; background: ${dim === resKey ? 'var(--accent-color)' : 'rgba(255,255,255,0.5)'}; border-radius: 3px;"></div>
              </div>
              <div style="width: 40px; text-align: right; color: ${dim === resKey ? 'var(--accent-color)' : 'var(--text-sub)'}; margin-left: 10px;">${finalPercent}%</div>
            </div>
          `;
        });
        document.getElementById('res-bars').innerHTML = barsHtml;
      } else {
        document.getElementById('res-bars').innerHTML = '';
      }
      
      // 填充深度报告
      if(data.diagnosis)      document.getElementById('dd-diagnosis').innerText = data.diagnosis;
      document.getElementById('dd-interpretation').innerText = data.interpretation;
      document.getElementById('dd-audience').innerText = data.audience;
      document.getElementById('dd-risk').innerText = data.risk;
      document.getElementById('dd-advice').innerText = data.advice;
      // 重置滚动位置到最左边
      const swipeContainer = document.getElementById("capture-wrapper");
      if (swipeContainer) swipeContainer.scrollLeft = 0;
      currentPosterIndex = 0;
      document.getElementById("poster-indicator").innerText = posterTitles[0];

      showPage('page-result');
      
      window.history.pushState(null, null, '#result');
      
      if (!isHistory) {
        saveHistory(resKey, resId, purityStr, counts);
      }
    }

    function toggleAccordion(element) {
      // 切换当前项的状态
      element.classList.toggle('active');
    }

    function saveHistory(resKey, resId, purityStr, counts) {
      const history = JSON.parse(localStorage.getItem('hiddenDesiresHistory') || '[]');
      const date = new Date().toLocaleString();
      history.unshift({ resKey, resId, date, purityStr, counts });
      if (history.length > 10) history.pop();
      localStorage.setItem('hiddenDesiresHistory', JSON.stringify(history));
    }

    function showHistory() {
      const history = JSON.parse(localStorage.getItem('hiddenDesiresHistory') || '[]');
      const listDiv = document.getElementById("history-list");
      listDiv.innerHTML = "";
      
      history.forEach(item => {
        const data = resultsPool[item.resKey];
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div>
            <div style="font-weight:bold; color:var(--text-main); margin-bottom:4px;">${data.title}</div>
            <div style="font-size:12px; color:var(--text-sub);">${item.date}</div>
          </div>
          <button style="background:var(--accent-color);border:none;padding:6px 12px;border-radius:12px;color:white;cursor:pointer;">查看</button>
        `;
        div.onclick = () => {
          closeHistory();
          const historyCounts = item.counts || {A:0, B:0, C:0, D:0, E:0, F:0};
          renderResultPage(item.resKey, item.resId, true, item.purityStr || "99.9%", historyCounts);
        };
        listDiv.appendChild(div);
      });
      
      document.getElementById("history-modal").classList.add("active");
    }

    function closeHistory() {
      document.getElementById("history-modal").classList.remove("active");
    }

    function resetQuiz() {
      currentQ = 0;
      scores = [];
      showPage('page-start');
      window.history.pushState(null, null, '');
      checkHistory();
    }

    let currentModalPosterIndex = 0;

    function generatePoster(index = currentPosterIndex) {
      currentModalPosterIndex = index;
      const targetId = 'poster-card-' + index;
      const wrapper = document.getElementById(targetId);
      if(!wrapper) return;
      const originalBg = wrapper.style.backgroundColor;
      wrapper.style.backgroundColor = '#0d0d0f'; 
      
      const img = document.getElementById('capture-image');
      const oldSrc = img.src;
      img.src = ''; // show empty during generation if re-generating
      document.getElementById('capture-modal').classList.add('active');

      htmlToImage.toPng(wrapper, { quality: 0.95 })
        .then(function (dataUrl) {
          wrapper.style.backgroundColor = originalBg;
          img.src = dataUrl;
        })
        .catch(function (error) {
          console.error('oops, something went wrong!', error);
          wrapper.style.backgroundColor = originalBg;
          img.src = oldSrc;
          alert('生成图片失败，请截图保存');
        });
    }

    function switchModalPoster(dir) {
      let nextIndex = currentModalPosterIndex + dir;
      if (nextIndex < 0) nextIndex = 1;
      if (nextIndex > 1) nextIndex = 0;
      generatePoster(nextIndex);
    }

  </script>
</body>
